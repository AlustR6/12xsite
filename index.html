<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Split 12x - Simple Split Timer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <div class="content">
      <div class="text-section">
        <img src="Split12xLogo.png" alt="Split 12x Logo" class="logo" />
        <h1>Split 12x</h1>
        <p class="subtitle">A simple and elegant split timer for speedrunners and focused tasks.</p>

        <a href="Split12x.zip" download class="download-button" onclick="trackDownload()">Download</a>

        <p class="download-count" id="downloadCount">Loading download count...</p>
        <p class="note">Includes executable and configuration files. Windows only.</p>
      </div>
      <div class="image-section">
        <img src="SplitExample.png" alt="Split 12x Example" class="example-image" />
      </div>
    </div>
  </main>

  <script>
    const counterEl = document.getElementById("downloadCount");

    // Fetch global count from Netlify Function
    fetch("/.netlify/functions/counter")
      .then(res => {
        if (!res.ok) throw new Error("Failed to fetch count.");
        return res.json();
      })
      .then(data => {
        counterEl.textContent = `Downloaded ${data.count} time${data.count !== 1 ? 's' : ''}`;
      })
      .catch(() => {
        counterEl.textContent = "Download count unavailable.";
      });

    // Update counter on download
    function trackDownload() {
      fetch("/.netlify/functions/counter", { method: "POST" })
        .then(res => res.json())
        .then(data => {
          counterEl.textContent = `Downloaded ${data.count} time${data.count !== 1 ? 's' : ''}`;
        })
        .catch(() => {
          counterEl.textContent = "Failed to update download count.";
        });
    }
  </script>
</body>
</html>
