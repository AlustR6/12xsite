<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="LK_pZZTzdzV5l4wODIUJ3k2Yi003BzjUcP0Yzzrl6OI" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Split 12x is a clean and intuitive splits software for speedrunners. Track all your split times. Free and easy to use.">
  <meta name="keywords" content="splits software, speedrun timer, LiveSplit alternative, speedrunning tool, splits tracker, splits overlay, timer overlay">
  <link rel="canonical" href="https://split12x.org" />
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Split 12x - Simple Split Timer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <a href="/" class="header-logo">
      <img src="Split12xLogo.png" alt="Split 12x Logo" />
      <span>Split 12x</span>
    </a>
    <nav class="header-nav">
      <a href="#how-to-use">How to Use</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="card">
    <div class="content">
      <div class="text-section">
        <img src="Split12xLogo.png" alt="Split 12x Logo" class="logo" />
        <h1>Split 12x</h1>
        <p class="subtitle">A simple and elegant split timer for speedrunners and focused tasks.</p>

        <a href="Split12x.zip" download class="download-button" onclick="trackDownload()">Download</a>

        <p class="download-count" id="downloadCount">Downloaded 0 times</p>
        <p class="note">Includes executable and configuration files. Windows only.</p>
      </div>
      <div class="image-section">
        <img src="SplitExample.png" alt="Split 12x Example" class="example-image" />
      </div>
    </div>
  </main>

  <script>
    const counterEl = document.getElementById("downloadCount");

    fetch("/.netlify/functions/counter")
      .then(res => res.ok ? res.json() : Promise.reject())
      .then(data => {
        counterEl.textContent = `Downloaded ${data.count} time${data.count !== 1 ? 's' : ''}`;
      })
      .catch(() => {
        counterEl.textContent = "Download count unavailable.";
      });

    function trackDownload() {
      fetch("/.netlify/functions/counter", { method: "POST" })
        .then(res => res.ok ? res.json() : Promise.reject())
        .then(data => {
          counterEl.textContent = `Downloaded ${data.count} time${data.count !== 1 ? 's' : ''}`;
        })
        .catch(() => {
          counterEl.textContent = "Failed to update download count.";
        });
    }
  </script>
</body>
</html>
